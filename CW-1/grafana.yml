# Grafana в docker (docker hub; apt/grafana.com из ВМ недоступны).
# Provisioning (datasource + дашборды) монтируется volume'ом.
- name: Deploy Grafana in docker on monitoring VM
  hosts: grafana_servers
  become: yes
  vars:
    grafana_dir: /opt/grafana
    grafana_admin_user: admin
    # TODO: сменить на нормальный пароль перед сдачей (тут плейсхолдер для морального теста)
    grafana_admin_password: cw1-admin

  tasks:
    - name: Install Docker engine + compose v2
      apt:
        name: [docker.io, docker-compose-v2]
        state: present
        update_cache: yes

    - name: Docker service started &enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Prepare directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ grafana_dir }}/provisioning/datasources"
        - "{{ grafana_dir }}/provisioning/dashboards"
        - "{{ grafana_dir }}/dashboards"

    - name: Provision Prometheus datasource
      copy:
        dest: "{{ grafana_dir }}/provisioning/datasources/prometheus.yml"
        content: |
          apiVersion: 1
          datasources:
            - name: Prometheus
              uid: Prometheus
              type: prometheus
              access: proxy
              url: "http://{{ prometheus_host }}:9090"
              isDefault: true
        mode: '0644'

    - name: Provision dashboards provider
      copy:
        dest: "{{ grafana_dir }}/provisioning/dashboards/provider.yml"
        content: |
          apiVersion: 1
          providers:
            - name: default
              type: file
              options:
                path: /var/lib/grafana/dashboards
        mode: '0644'

    - name: Upload dashboards
      copy:
        src: "{{ item }}"
        dest: "{{ grafana_dir }}/dashboards/"
        mode: '0644'
      loop: "{{ lookup('fileglob', 'dashboards/*.json', wantlist=True) }}"

    - name: Push Grafana compose file
      template:
        src: ./docker-compose-grafana.yml.j2
        dest: "{{ grafana_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Start Grafana
      community.docker.docker_compose_v2:
        project_src: "{{ grafana_dir }}"
        state: present

    - name: Wait for Grafana health endpoint
      uri:
        url: http://localhost:3000/api/health
        status_code: 200
      register: gf_health
      retries: 20
      delay: 10
      until: gf_health.status == 200
