# Установка Docker + деплой лог-стека (Elasticsearch на log_servers,
# Kibana на kibana_servers — по заданию это разные ВМ).
- name: Elasticsearch stack on log VM
  hosts: log_servers
  become: yes
  vars:
    compose_dir: /opt/logging

  tasks:
    - name: Install Docker engine + compose v2 (из собственного репо Ubuntu — наружный HTTPS с ВМ недоступен)
      apt:
        name: [docker.io, docker-compose-v2, ca-certificates, curl, gnupg]
        state: present
        update_cache: yes

    - name: Docker service started & enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create compose directory
      file:
        path: "{{ compose_dir }}"
        state: directory
        mode: '0755'

    - name: Push Elasticsearch compose file
      copy:
        src: ./docker-compose-es.yml
        dest: "{{ compose_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Start Elasticsearch
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: present

    - name: Wait for Elasticsearch to answer on :9200
      uri:
        url: http://localhost:9200
        status_code: 200
      register: es_health
      retries: 30
      delay: 10
      until: es_health.status == 200

- name: Kibana stack on kibana VM
  hosts: kibana_servers
  become: yes
  vars:
    compose_dir: /opt/kibana

  tasks:
    - name: Install Docker engine + compose v2 (из собственного репо Ubuntu — наружный HTTPS с ВМ недоступен)
      apt:
        name: [docker.io, docker-compose-v2, ca-certificates, curl, gnupg]
        state: present
        update_cache: yes

    - name: Docker service started & enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create compose directory
      file:
        path: "{{ compose_dir }}"
        state: directory
        mode: '0755'

    - name: Push Kibana compose file (templated ES host)
      template:
        src: ./docker-compose-kibana.yml.j2
        dest: "{{ compose_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Start Kibana
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: present

    - name: Wait for Kibana to answer on :5601
      uri:
        url: http://localhost:5601/app/kibana
        status_code: [200, 302]
      register: kibana_health
      retries: 30
      delay: 10
      until: kibana_health.status is defined and kibana_health.status in [200, 302]
