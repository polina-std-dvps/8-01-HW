- name: Deploy logging stack (docker + Elasticsearch + Kibana)
  hosts: log_servers
  become: yes

  vars:
    compose_dir: /opt/logging

  tasks:
    - name: Install prerequisites
      apt:
        name: [ca-certificates, curl, gnupg]
        state: present
        update_cache: yes

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /usr/share/keyrings/docker.asc
        mode: '0644'

    - name: Add Docker repository
      copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: |
          deb [arch=amd64 signed-by=/usr/share/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable

    - name: Install Docker engine + compose plugin
      apt:
        name: [docker-ce, docker-ce-cli, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: yes

    - name: Docker service started & enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create compose directory
      file:
        path: "{{ compose_dir }}"
        state: directory
        mode: '0755'

    - name: Push docker-compose.yml to logging VM
      copy:
        src: ./docker-compose.yml
        dest: "{{ compose_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Start logging stack
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: present

    - name: Wait for Elasticsearch to answer on :9200
      uri:
        url: http://localhost:9200
        status_code: 200
      register: es_health
      retries: 30
      delay: 10
      until: es_health.status == 200
