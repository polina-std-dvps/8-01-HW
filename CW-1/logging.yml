# Filebeat на web-серверах, в docker (в репо Elastic 403 из зоны YC,
# а docker уже поставлен на эти ВМ). Логи nginx монтируются внутрь
# контейнера read-only, конфиг генерируется Ansible'ом.
- name: Deploy Filebeat in docker on web servers
  hosts: web_servers
  become: yes
  vars:
    compose_dir: /opt/filebeat

  tasks:
    - name: Remove stale Elastic apt repo (403 в зоне YC, ломает apt update)
      file:
        path: /etc/apt/sources.list.d/elastic-7.x.list
        state: absent

    - name: Install Docker engine + compose v2
      apt:
        name: [docker.io, docker-compose-v2, ca-certificates]
        state: present
        update_cache: yes

    - name: Docker service started & enabled
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Create compose directory
      file:
        path: "{{ compose_dir }}"
        state: directory
        mode: '0755'

    - name: Generate filebeat.yml (inputs = nginx access/error, output = по inventory)
      copy:
        dest: "{{ compose_dir }}/filebeat.yml"
        content: |
          filebeat.inputs:
          - type: log
            enabled: true
            paths:
              - /var/log/nginx/access.log
              - /var/log/nginx/error.log

          output.elasticsearch:
            hosts: ["{{ elasticsearch_host }}:9200"]

          processors:
            - add_host_metadata: ~
        mode: '0644'

    - name: Push Filebeat compose file
      template:
        src: ./docker-compose-filebeat.yml.j2
        dest: "{{ compose_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Start Filebeat
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: present

    - name: Verify filebeat container is Up
      command: docker ps --filter name=filebeat
      register: fb_ps
      retries: 9
      delay: 10
      until: "'filebeat' in fb_ps.stdout and 'Up' in fb_ps.stdout"
      changed_when: false

    # ES у нас single-node: реплики некуда размещать -> зелёный кластер
    - name: Ensure filebeat indices have 0 replicas (single-node ES)
      uri:
        url: "http://{{ elasticsearch_host }}:9200/_template/filebeat_unassigned"
        method: PUT
        status_code: [200, 201]
        body_format: json
        body:
          index_patterns:
            - "filebeat-*"
          settings:
            number_of_replicas: 0
      changed_when: false

    - name: Replicas=0 для уже созданных индексов
      uri:
        url: "http://{{ elasticsearch_host }}:9200/filebeat-*/_settings"
        method: PUT
        status_code: [200, 201]
        body_format: json
        body:
          index:
            number_of_replicas: 0
      changed_when: false
