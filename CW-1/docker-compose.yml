# Стек для пункта "Логи" задания: Elasticsearch + Kibana.
# Разворачивается на отдельной ВМ (playbook: docker.yml), НЕ на ноутбуке:
# логи должны быть доступны проверяющему и по сети изнутри облака.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      # Экономный heap: ВМ 2 ГБ, core_fraction 20 (лимиты триал-аккаунта)
      - ES_JAVA_OPTS=-Xms512m -Xmx1024m
      - xpack.security.enabled=false
    ports:
      # 9200 слушает ВМ полностью - filebeat с web-серверов ходит по VPC
      - "9200:9200"
    volumes:
      # Данные логов переживают перезапуск контейнера
      - es_data:/usr/share/elasticsearch/data
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.10
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      # Экономим память ВМ: kibana JVM по умолчанию ест 1 ГБ
      - NODE_OPTIONS="--max-old-space-size=512"
    ports:
      # Kibana привязана только к localhost ВМ: UI открывается через
      # SSH-туннель (ssh -L 5601:localhost:5601 ...), не светим её всему интернету
      - "127.0.0.1:5601:5601"
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  es_data:
    driver: local
