[web_servers]
# web-a: наружный NAT у провайдера недоступен (153.51.*) — идём через ProxyJump (внутренний IP)
web_server_a ansible_host=192.168.110.14 internal_ip=192.168.110.14 ansible_ssh_common_args='-o ProxyJump=ubuntu@158.160.232.138'
# web-b: СТАТИЧЕСКИЙ IP — не меняется при перезагрузках
web_server_b ansible_host=158.160.232.138 internal_ip=192.168.120.32

[monitoring_servers]
# TODO: сменить на статический, когда поднимем квоту статических IP в консоли YC
monitoring_host ansible_host=93.77.161.98 internal_ip=192.168.110.10

[web_servers:vars]
ansible_user=ubuntu

[monitoring_servers:vars]
ansible_user=ubuntu

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa

# --- Сервисные адреса (см. распределение стеков в README) ---
# Elasticsearch крутится в docker на web-a (была идея отдельная ВМ,
# но дисковая квота SSD/HDD Я.Клауд её не даёт)
elasticsearch_host=192.168.110.14
# Prometheus для Grafana (внутренний IP monitoring VM)
prometheus_host=192.168.110.10

[log_servers]
web_server_a

[kibana_servers]
web_server_b

[grafana_servers]
monitoring_host
