# Пункт «Сеть»: SSH во все ВМ — ТОЛЬКО через bastion (SG на 22 от него).
# Bastion NAT у нас динамический; его IP выдаёт terraform output bastion_public_ip.
[bastion]
bastion ansible_host=178.154.232.162

[web_servers]
web_server_a ansible_host=192.168.110.14 internal_ip=192.168.110.14 ansible_ssh_common_args='-o ProxyJump=ubuntu@178.154.232.162 -o StrictHostKeyChecking=accept-new'
# Статический IP нам теперь нужен только для наружной проверки Kibana (:5601)
web_server_b ansible_host=192.168.120.32 internal_ip=192.168.120.32 ansible_ssh_common_args='-o ProxyJump=ubuntu@178.154.232.162 -o StrictHostKeyChecking=accept-new'

[monitoring_servers]
monitoring_host ansible_host=192.168.110.10 internal_ip=192.168.110.10 ansible_ssh_common_args='-o ProxyJump=ubuntu@178.154.232.162 -o StrictHostKeyChecking=accept-new'

[kibana_servers]
web_server_b

[log_servers]
web_server_a

[grafana_servers]
monitoring_host

[web_servers:vars]
ansible_user=ubuntu

[monitoring_servers:vars]
ansible_user=ubuntu

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/id_rsa

# --- Сервисные адреса ---
# ES в docker на web-a, Kibana в docker на web-b (распределение из-за дисковых квот)
elasticsearch_host=192.168.110.14
prometheus_host=192.168.110.10
